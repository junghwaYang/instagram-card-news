<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
html { background: #1A1A2E; }
body {
  width: 720pt;
  height: 405pt;
  margin: 0;
  padding: 0;
  display: flex;
  background: #1A1A2E;
  color: #FFFFFF;
  font-family: Arial, Helvetica, sans-serif;
}
.slide {
  width: 100%;
  height: 100%;
  padding: 24pt 28pt 22pt;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 10pt;
}
.kicker {
  font-size: 11pt;
  font-weight: 700;
  color: #2D63E2;
  letter-spacing: 0.6pt;
  margin: 0;
}
h1 {
  font-family: 'Arial Black', Impact, Arial, sans-serif;
  font-size: 36pt;
  line-height: 1.05;
  margin: 0;
  color: #FFFFFF;
}
h2 {
  font-family: 'Arial Black', Impact, Arial, sans-serif;
  font-size: 24pt;
  line-height: 1.15;
  margin: 0;
  color: #FFFFFF;
}
h3 {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  font-size: 14pt;
  color: #2D63E2;
}
p {
  margin: 0;
  font-size: 12pt;
  line-height: 1.35;
  color: #FFFFFF;
}
.sub {
  color: #B0B0B0;
  font-size: 13pt;
}
.tiny { font-size: 10pt; color: #B0B0B0; }
.body { flex: 1; display: flex; flex-direction: column; gap: 10pt; }
.row { display: flex; gap: 10pt; align-items: stretch; }
.row.center { align-items: center; justify-content: center; }
.col { flex: 1; display: flex; flex-direction: column; gap: 8pt; }
.card {
  background: #20243C;
  border: 1.5pt solid #2D63E2;
  border-radius: 10pt;
  padding: 10pt 12pt;
  box-sizing: border-box;
}
.card.soft {
  background: #252B49;
  border-color: #3A4E9A;
}
ul, ol { margin: 0; padding-left: 18pt; display: flex; flex-direction: column; gap: 5pt; }
li { color: #FFFFFF; font-size: 11.5pt; line-height: 1.3; }
.chip {
  display: inline-block;
  color: #2D63E2;
  font-weight: 700;
}
.metric { font-family: 'Arial Black', Impact, Arial, sans-serif; font-size: 28pt; color: #2D63E2; }
.metric-small { font-family: 'Arial Black', Impact, Arial, sans-serif; font-size: 20pt; color: #2D63E2; }
.arrow {
  font-family: 'Arial Black', Impact, Arial, sans-serif;
  color: #2D63E2;
  font-size: 18pt;
  text-align: center;
}
.flow-box {
  background: #20243C;
  border: 1.5pt solid #2D63E2;
  border-radius: 8pt;
  padding: 8pt;
  min-height: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4pt;
}
.flow-box p { text-align: center; font-size: 9.4pt; line-height: 1.22; }
.flow-box h3 { text-align: center; font-size: 10pt; }
.table { display: flex; flex-direction: column; gap: 3pt; }
.tr { display: flex; gap: 3pt; }
.th, .td {
  flex: 1;
  padding: 6pt 7pt;
  border-radius: 6pt;
  background: #252B49;
  border: 1pt solid #3A4E9A;
}
.th { background: #223A7A; border-color: #2D63E2; }
.th p { font-size: 9.8pt; font-weight: 700; text-align: center; }
.td p { font-size: 9.6pt; line-height: 1.22; }
.code {
  font-family: 'Courier New', monospace;
  font-size: 9pt;
  line-height: 1.3;
  white-space: pre-wrap;
  color: #DCE6FF;
}
.footer {
  border-top: 1pt solid #30447C;
  padding-top: 5pt;
}
.footer p { font-size: 10pt; color: #B0B0B0; }
.center-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14pt; }
.badge-row { display: flex; gap: 6pt; flex-wrap: wrap; }
.badge-row p { font-size: 9.6pt; }
</style>
</head>
<body>
  <div class="slide">
    <p class="kicker">파트 3 · Step 3.5</p>
    <h1>카피 토론 시퀀스</h1>
    <p class="sub">TeamCreate → TaskCreate → SendMessage 라운드 반복</p>
    <div class="body">
      <div class="row center">
        <div class="flow-box"><h3>1</h3><p>TeamCreate</p></div><p class="arrow">→</p>
        <div class="flow-box"><h3>2</h3><p>TaskCreate</p></div><p class="arrow">→</p>
        <div class="flow-box"><h3>3</h3><p>초안 공유</p></div>
      </div>
      <div class="row center">
        <div class="flow-box"><h3>4</h3><p>후킹 점수</p></div><p class="arrow">→</p>
        <div class="flow-box"><h3>5</h3><p>피드백 반영</p></div><p class="arrow">→</p>
        <div class="flow-box"><h3>6</h3><p>합의 후 종료</p></div>
      </div>
      <p class="tiny">최대 3라운드, 후킹 점수 7점 이상에서 확정</p></div>
    
  </div>
</body>
</html>
